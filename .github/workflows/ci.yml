name : CI Symfony
run-name: Pourquoi pas hein !
on: [push]
jobs:
  symfony:
    name: CI symfony
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ secrets.test }}
      DATABASE_URL: ${{ secrets.mysql://root:root@127.0.0.1:3306/pitstop }}
      ES_HOST: ${{ secrets.localhost }}
      ES_PORT: ${{ secrets.8000 }}

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.root }}
          MARIADB_DATABASE: ${{ secrets.pitstop_test }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v7

    - name: Installation des dépendances
      run: composer install

    - name: MAJ des dépendances
      run: composer update
      
    - name: Mise en place de la BDD
      run: |
        php bin/console doctrine:database:create --if-not-exists
        php bin/console doctrine:migrations:migrate --no-interaction

    - name: Linter
      run: |
        php bin/console lint:yaml config/
        php bin/console lint:twig templates/
        php bin/console lint:container
        php bin/console lint:translations

    - name: Php stan
      run: composer require --dev phpstan/phpstan

    - name: CS-fixer
      run: vendor/bin/php-cs-fixer fix

    - name: Fixtures
      run: php bin/console doctrine:fixtures:load --no-interaction

    - name: Tests
      run: ./vendor/bin/phpunit
