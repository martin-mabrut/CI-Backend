name : CI Symfony
run-name: CI Terminée et sécurisée.
on: [push]
jobs:
  symfony:
    name: CI symfony
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ secrets.APP_ENV }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ES_HOST: ${{ secrets.ES_HOST }}
      ES_PORT: ${{ secrets.ES_PORT }}

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.MARIADB_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s

    steps:

    - name: Récupérer le code
      uses: actions/checkout@v7

    - name: 'Create env file'
      run: |
        touch .env
        echo APP_ENV= ${{ secrets.APP_ENV }} >> .env
        echo APP_SHARE_DIR=${{ secrets.APP_SHARE_DIR }} >> .env
        echo DEFAULT_URI= ${{ secrets.DEFAULT_URI }} >> .env
        echo DATABASE_URL= ${{ secrets.DATABASE_URL }} >> .env
        echo MESSENGER_TRANSPORT_DSN= ${{ secrets.MESSENGER_TRANSPORT_DSN }} >> .env
        echo CORS_ALLOW_ORIGIN= ${{ secrets.CORS_ALLOW_ORIGIN }} >> .env
        echo JWT_SECRET_KEY= ${{ secrets.JWT_SECRET_KEY }} >> .env
        echo JWT_PUBLIC_KEY= ${{ secrets.JWT_PUBLIC_KEY }} >> .env
        echo JWT_PASSPHRASE= ${{ secrets.JWT_PASSPHRASE }} >> .env
        cat .env

    - name: 'Create env.dev file'
      run: |
        touch .env.dev
        echo APP_SECRET= ${{ secrets.APP_SECRET_DEV }} >> .env.dev
        cat .env.dev

    - name: 'Create env.test file'
      run: |
        touch .env.test
        echo KERNEL_CLASS= ${{ secrets.KERNEL_CLASS }} >> .env.test
        echo APP_SECRET= ${{ secrets.APP_SECRET_TEST }} >> .env.test
        echo DATABASE_URL= ${{ secrets.DATABASE_URL_TEST }} >> .env.test
        cat .env.test

    - name: Installation des dépendances
      run: composer install

    - name: MAJ des dépendances
      run: composer update
      
    - name: Mise en place de la BDD
      run: |
        php bin/console doctrine:database:create --if-not-exists
        php bin/console doctrine:migrations:migrate --no-interaction

    - name: Linter
      run: |
        php bin/console lint:yaml config/
        php bin/console lint:twig templates/
        php bin/console lint:container
        php bin/console lint:translations

    - name: Php stan
      run: composer require --dev phpstan/phpstan

    - name: CS-fixer
      run: vendor/bin/php-cs-fixer fix

    - name: Fixtures
      run: php bin/console doctrine:fixtures:load --no-interaction

    - name: Tests
      run: ./vendor/bin/phpunit
